name: CI

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: resolve MSRV
        id: resolve-msrv
        run: echo MSRV=`cargo metadata --format-version 1 --no-deps --frozen --quiet --offline --manifest-path Cargo.toml | jq -r '.packages[0].rust_version'` >> $GITHUB_OUTPUT

  test:
    name: test rust-${{ matrix.rust-version }}
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        rust-version: [stable, beta, nightly]
        include:
          - rust-version: ${{ needs.resolve.outputs.MSRV }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust-version }}
        components: llvm-tools

    - id: cache-rust
      uses: Swatinem/rust-cache@v2

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - run: rustup component add llvm-tools-preview

    - run: cargo llvm-cov test --test main --codecov --output-path coverage.json
      env:
        RUST_BACKTRACE: 1

    - run: cargo test --doc

    - uses: codecov/codecov-action@v7
      with:
        files: coverage.json
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}


  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@nightly
    - uses: Swatinem/rust-cache@v2

    - run: cargo bench

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files --verbose
      env:
        PRE_COMMIT_COLOR: always
        SKIP: test

    - run: cargo doc

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs: [test, bench, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: [check]
    if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    environment: release

    steps:
    - uses: actions/checkout@v7

    - name: install rust stable
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
